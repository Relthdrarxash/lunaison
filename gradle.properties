org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Les cibles iOS ne sont compilées que sur macOS : on ignore celles que la machine ne sait pas construire.
kotlin.native.ignoreDisabledTargets=true

# Room multiplateforme : le KSP2 résout correctement les bibliothèques natives iOS (KSP1 échoue sur « KLIB resolver »).
ksp.useKSP2=true
