name: Captures d'écran

# Affiche les écrans avec des données d'exemple, sans téléphone ni émulateur,
# et publie les images (documentation, fiche Play, relecture).
on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - "ui/**"
      - "screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Générer les captures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Afficher les écrans
        run: |
          set -o pipefail
          ./gradlew :screenshots:recordPaparazziDebug 2>&1 | tee gradle.log

      - name: Résumer l'erreur
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Caused by|FAILED|Exception" -A 4 gradle.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Renommer
        run: |
          mkdir -p captures
          for f in screenshots/src/test/snapshots/images/*_ScreensTest_*.png; do
            name=$(basename "$f")
            cp "$f" "captures/${name#*_ScreensTest_captures_}"
          done
          ls -la captures

      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/
          retention-days: 30
