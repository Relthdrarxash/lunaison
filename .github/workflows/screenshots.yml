name: Captures d'écran

# Affiche les écrans avec des données d'exemple, sans téléphone ni émulateur,
# et publie les images (documentation, fiche Play, relecture).
on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - "ui/**"
      - "screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Générer les captures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Afficher les écrans
        run: |
          set -o pipefail
          ./gradlew :screenshots:recordPaparazziDebug 2>&1 | tee gradle.log

      - name: Résumer l'erreur
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Caused by|FAILED|Exception" -A 4 gradle.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Copier dans docs/captures et dans la fiche des stores
        run: |
          STORE_FR=fastlane/metadata/android/fr-FR/images/phoneScreenshots
          STORE_EN=fastlane/metadata/android/en-US/images/phoneScreenshots
          mkdir -p docs/captures docs/captures/en "$STORE_FR" "$STORE_EN"
          for f in screenshots/src/test/snapshots/images/*_ScreensTest_*.png; do
            name=$(basename "$f")
            cp "$f" "docs/captures/${name#*_ScreensTest_captures_}"
          done
          for f in screenshots/src/test/snapshots/images/*_ScreensEnTest_*.png; do
            name=$(basename "$f")
            cp "$f" "docs/captures/en/${name#*_ScreensEnTest_captures_}"
          done
          cp docs/captures/accueil.png "$STORE_FR/ecran1_accueil.png"
          cp docs/captures/journee.png "$STORE_FR/ecran2_journee.png"
          cp docs/captures/calendrier.png "$STORE_FR/ecran3_calendrier.png"
          cp docs/captures/comprendre.png "$STORE_FR/ecran4_comprendre.png"
          cp docs/captures/fiche_douleurs.png "$STORE_FR/ecran5_fiche_douleurs.png"
          cp docs/captures/partage.png "$STORE_FR/ecran6_partage.png"
          cp docs/captures/en/accueil.png "$STORE_EN/ecran1_accueil.png"
          cp docs/captures/en/journee.png "$STORE_EN/ecran2_journee.png"
          cp docs/captures/en/calendrier.png "$STORE_EN/ecran3_calendrier.png"
          cp docs/captures/en/comprendre.png "$STORE_EN/ecran4_comprendre.png"
          cp docs/captures/en/fiche_douleurs.png "$STORE_EN/ecran5_fiche_douleurs.png"
          cp docs/captures/en/partage.png "$STORE_EN/ecran6_partage.png"
          ls -la docs/captures docs/captures/en "$STORE_FR" "$STORE_EN"

      # Un envoi fait avec le jeton de la CI ne relance pas les workflows : pas de boucle.
      - name: Enregistrer si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/captures fastlane/metadata/android/fr-FR/images/phoneScreenshots fastlane/metadata/android/en-US/images/phoneScreenshots
          if git diff --cached --quiet; then
            echo "Captures inchangées."
          else
            git commit -m "Captures d'écran à jour"
            git push
          fi
